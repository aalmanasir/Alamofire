version: 2
updates:
  - package-ecosystem: "bundler"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Asia/Dubai"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ruby"

  - package-ecosystem: "swift"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:15"
      timezone: "Asia/Dubai"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "swift"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:30"
      timezone: "Asia/Dubai"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
